<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formularioconestilo.css">
</head>
<body>
    <h1>Formulario de registro</h1>

<form action="#" method="get">
<p>
<label for="nombre">Nombre:</label>
<input type="text" id="nombre" name="nombre" maxlength="50" required>
</p>

<p>
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" maxlength="50" required>
</p>

<p>
    Sexo: <input type="radio" name="sexo" id="sexo-h" value="h" required/>
    <label for="sexo-h">hombre</label>
    <input type="radio" name="sexo" id="sexo-m" value="m" required/>
    <label for="sexo-m">mujer</label>
    <input type="radio" name="sexo" id="sexo-s" value="s" required/>
    <label for="sexo-s">siempre</label> 
</p>

<p>
    <label for="correo">correo:</label>
    <input type="text" name="correo" id="correo" maxlength="100" required/>
</p>

<p>
    <label for="estado">poblacion:</label>
    <select name="estado" id="estado" required>
        <option value="1">Aguascalientes</option>
        <option value="2">Baja California</option>
        <option value="3">Baja California Sur</option>
        <option value="4">Campeche</option>
    </select>
</p>

<p>
    <label for="descripcion">Descripcion:</label>
    <textarea name="descripcion" id="descripcion" cols="60" rows="6" required></textarea>
</p>

<p>
    <input type="checkbox" name="info" id="info" checked="checked"/>
    <label for="info">Deseo recibir información sobre novedades y ofertas</label>
</p>

<p>
    <input type="checkbox" name="condiciones" id="condiciones" required/>
    <label for="condiciones">Declaro haber leido y aceptar las condiciones generales del programa y la normativa sobre proteccion de datos</label>
</p>

<p>
    <input type="submit" value="enviar"/>
</p>

</form>
</body>
</html>
