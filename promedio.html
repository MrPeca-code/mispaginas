<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promedio</title>
    <link rel="stylesheet" href="css/promedio.css">
    <script src="js/promedio.js" defer></script>
</head>
<body>

    <div class="contenedor">
        <h2>Control</h2>
        <p>Ingresa calificaciones por parcial:</p>

        <input type="number" id="parcial1" placeholder="Parcial 1" min="0" max="10" step="0.1">
        <input type="number" id="parcial2" placeholder="Parcial 2" min="0" max="10" step="0.1">
        <input type="number" id="parcial3" placeholder="Parcial 3" min="0" max="10" step="0.1">
        <br>
        <button id="botoncalcular">calcular promedio</button>
        <div id="resultado" class="resultado"></div>
    </div>

</body>
</html>
